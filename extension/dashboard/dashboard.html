<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VantageForge</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #0f1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #181b23;
            padding: 20px;
            border-radius: 10px;
            min-width: 150px;
        }

        .card h3 {
            margin: 0 0 10px;
            color: #999;
            font-size: 14px;
        }

        .card p {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #181b23;
            border-radius: 10px;
            overflow: hidden;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #292d36;
        }

        th {
            color: #999;
            font-size: 13px;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>

    <h1>VantageForge</h1>

    <div class="stats">

        <div class="card">
            <h3>Total Trades</h3>
            <p id="totalTrades">0</p>
        </div>

        <div class="card">
            <h3>Wins</h3>
            <p id="wins">0</p>
        </div>

        <div class="card">
            <h3>Losses</h3>
            <p id="losses">0</p>
        </div>

    </div>

    <h2>Trade History</h2>

    <table>

        <thead>
            <tr>
                <th>Date</th>
                <th>Symbol</th>
                <th>Direction</th>
                <th>Entry</th>
                <th>SL</th>
                <th>TP</th>
                <th>Exit</th>
                <th>Result</th>
            </tr>
        </thead>

        <tbody id="tradeTableBody">
        </tbody>

    </table>

    <script type="module" src="./dashboard.js"></script>

</body>
</html>
